name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build plugin
        run: npm run build

      - name: Validate plugin
        run: npm run validate

      - name: Prepare release files
        id: release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          cp dist/lxmusic.jsplugin.zip "dist/lxmusic-v${VERSION}.jsplugin.zip"
          sha256sum "dist/lxmusic-v${VERSION}.jsplugin.zip" | awk '{print $1}' > "dist/lxmusic-v${VERSION}.jsplugin.zip.sha256"
          zip -qr "dist/songloft-plugin-lxmusic-v${VERSION}-source.zip" . \
            -x '.git/*' 'node_modules/*' 'dist/*'

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: v${{ steps.release.outputs.version }}
          generate_release_notes: true
          files: |
            dist/lxmusic-v${{ steps.release.outputs.version }}.jsplugin.zip
            dist/lxmusic-v${{ steps.release.outputs.version }}.jsplugin.zip.sha256
            dist/songloft-plugin-lxmusic-v${{ steps.release.outputs.version }}-source.zip
