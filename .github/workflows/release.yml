name: Build and Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete source
        shell: bash
        run: |
          if compgen -G "bootstrap/remaining.b64.*" > /dev/null; then
            mkdir -p /tmp/lx-bootstrap
            : > /tmp/lx-bootstrap/remaining.zip
            for file in bootstrap/remaining.b64.*; do
              base64 -d "$file" >> /tmp/lx-bootstrap/remaining.zip
            done
            unzip -qo /tmp/lx-bootstrap/remaining.zip -d .
            rm -rf bootstrap
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "feat: import complete v0.1.14 source [skip ci]"
              git push
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build plugin
        run: npm run build

      - name: Validate plugin
        run: npm run validate

      - name: Prepare release files
        id: release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          cp dist/neo-lxbridge.jsplugin.zip "dist/neo-lxbridge-v${VERSION}.jsplugin.zip"
          sha256sum "dist/neo-lxbridge-v${VERSION}.jsplugin.zip" | awk '{print $1}' > "dist/neo-lxbridge-v${VERSION}.jsplugin.zip.sha256"
          zip -qr "dist/songloft-plugin-neo-lxbridge-v${VERSION}-source.zip" . \
            -x '.git/*' 'node_modules/*' 'dist/*'

      - name: Create or update GitHub Release
        if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'agent/release-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: v${{ steps.release.outputs.version }}
          generate_release_notes: true
          files: |
            dist/neo-lxbridge-v${{ steps.release.outputs.version }}.jsplugin.zip
            dist/neo-lxbridge-v${{ steps.release.outputs.version }}.jsplugin.zip.sha256
            dist/songloft-plugin-neo-lxbridge-v${{ steps.release.outputs.version }}-source.zip
